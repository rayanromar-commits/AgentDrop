# ===================================================================
# AgentDrop configuration
# Edit this file to control how AgentDrop behaves. No coding needed.
# Lines starting with '#' are comments (ignored by the program).
# Keep the indentation (spaces) exactly as shown — YAML cares about it.
# ===================================================================

# --- STORY SOURCING -------------------------------------------------
# Where stories come from:
#   manual  = read .txt files you drop into sourcing/manual_stories/
#             (use this until your Reddit API access is approved)
#   reddit  = pull live from the Reddit API (needs approved API keys)

# --- CONTENT TYPE ---------------------------------------------------
# What kind of channel this pipeline produces:
#   story = Reddit-story narration Shorts (the original StoryDropper channel)
#   quiz  = emoji-riddle quiz Shorts ("Guess the X by emoji") — the NEW channel
# The quiz path ignores story_source / subreddits / voiceover / splitting and
# uses the `quiz:` block below instead.
content_type: quiz

# --- QUIZ CHANNEL (only used when content_type: quiz) ---------------
quiz:
  dataset: sourcing/quiz_data/football.json  # which category JSON to pull from
  questions_per_video: 5                      # emoji clues per Short (~27s at a 3s timer)
  batch: 5                                     # candidate round-sets sampled per fetch
  handle: "@FootyEmoji"                        # on-screen watermark — change to your handle
  # Optional background music: drop a rights-cleared track (e.g. from the
  # YouTube Audio Library) in the repo and set its path here. If unset, a
  # synthesized trivia bed is used. Example: assets/trivia_bed.mp3
  music:

story_source: manual

# Which subreddits to pull stories from. Add/remove as you like.
subreddits:
  - MaliciousCompliance
  - ProRevenge
  - pettyrevenge
  - entitledparents
  - tifu
  - AmItheAsshole
  - confession         # personal confessions (high drama/engagement)
  # NOTE: horror/scary subs (nosleep, LetsNotMeet, shortscarystories,
  # creepyencounters, horrorstories) are intentionally OFF. On 2026-06-29 the
  # channel's horror Shorts badly underperformed the AITA/revenge lane
  # (9-187 views vs 700-950). Staying in the proven niche until it's saturated.
  # Paused horror scripts live in sourcing/manual_stories/paused/.

# How many top posts to look at per subreddit on each run.
posts_to_scan_per_subreddit: 25

# Pull from this time window: hour, day, week, month, year, all
reddit_time_filter: day

# --- SCREENING / FILTERING ------------------------------------------
# A story must fall within this word count to be used.
# LENGTH POLICY (2026-07-02): target SHORT, high-retention Shorts (~45-55s),
# NOT 1min+. Shorts monetize via the Shorts ad pool at ANY length once in YPP
# (the 1min/8min rules are long-form only), so length buys us nothing while a
# shorter video lifts completion/loop-rate — the algorithmic push signal.
# HARD RULE (user 2026-07-02): NO video over 1 minute, ever.
# Narration rate is CALIBRATED from a real 2-part video (438 words -> 183s):
# ~2.39 words/sec all-in (hook + outro + pauses included) ≈ 143 wpm effective.
# That's slower than the raw TTS wpm, so size parts off THIS number:
#   words_per_part 120 -> 120/2.39 ≈ 50s worst-case part (safe margin < 60s).
#   min_word_count 100 -> ~42s floor.
# Long stories are handled by splitting (see below), not by this ceiling, so
# max_word_count stays generous.
min_word_count: 100
max_word_count: 500

# Skip posts flagged Not-Safe-For-Work by Reddit.
skip_nsfw: true

# Reject a story for profanity/slurs?
#   false = profanity is ALLOWED (your choice).
# NOTE: even with profanity allowed here, see the monetization warning
# in chat — strong language can limit YouTube ad revenue. We can later
# add an option to bleep/censor swear words in the audio only.
reject_profanity: false

# Words/phrases that REJECT a story. Case-insensitive, whole-word.
# Focused on graphic sexual content (your stated red line). The NSFW
# flag (skip_nsfw above) is the first net; this is the backup.
# Edit freely — add or remove anything. These target explicit sexual
# content specifically (profanity is allowed per reject_profanity).
extra_blocklist:
  - blowjob
  - handjob
  - cumshot
  - creampie
  - masturbat   # partial-word friendly variants
  - orgasm
  - bestiality
  - incest
  # Gross-out / shock content — advertiser-unfriendly, reach-throttled by
  # YouTube and off-putting for storytime. (The "excrement" petty-revenge
  # Short on 2026-06-29 got throttled to ~70-190 views vs the usual 700+.)
  - excrement
  - feces
  - faeces
  - defecat     # defecate / defecation
  - diarrhea
  - diarrhoea

# --- LONG-STORY SPLITTING -------------------------------------------
# Stories longer than one part get split into "Part 1", "Part 2", ...
# each its own video, published in order (oldest slot first).
splitting:
  enabled: true
  words_per_part: 120    # ~120 words ≈ 50s at the calibrated 2.39 w/s rate
                         # (see length policy above) — guarantees every part
                         # stays under the 1-minute hard cap. Lowered from 375
                         # (~2:15/part) on 2026-07-02. split_text balances into
                         # EQUAL parts, so no part ever exceeds ~120 words.
  max_parts: 3           # HARD CAP (user 2026-07-03): no story becomes more
                         # than 3 videos — less fragmentation, fewer weak later
                         # parts. At 120 w/part this = a ~360-WORD CEILING:
                         # stories longer than that are SKIPPED (not truncated),
                         # so source/trim stories to <=360 words (100-350 ideal).

# --- VOICEOVER (TTS = Text To Speech) -------------------------------
voiceover:
  provider: elevenlabs        # which TTS service to use
  # AgentDrop rotates through the voices below, using a DIFFERENT voice
  # for each new story (a multi-part series keeps one narrator, then the
  # next story switches). Add/remove voices freely — paste any voice's
  # ID from your ElevenLabs Voice Library. The list rotates in order and
  # the position is remembered across restarts.
  # These IDs are ElevenLabs' built-in default voices (on every account).
  voices:
    - {name: Rachel, id: 21m00Tcm4TlvDq8ikWAM}   # clear US female
    - {name: Adam,   id: pNInz6obpgDQGcFmaJgB}   # deep US male
    - {name: Antoni, id: ErXwobaYiN019PkySvjV}   # warm US male
    - {name: Bella,  id: EXAVITQu4vr4xnSDxMaL}   # soft US female
    - {name: Josh,   id: TxGEqnHWrfWFTfGW9XjX}   # young US male
    - {name: Elli,   id: MF3mGyEYCl7XYWbV9V6O}   # emotive US female
    - {name: Sam,    id: yoZ06aMxZJJ28mfd3POQ}   # neutral US male
    - {name: Arnold, id: VR6AewLTigWG4xSOukaG}   # crisp US male
  # Fallback single voice (used only if the 'voices' list above is empty).
  voice_id: 21m00Tcm4TlvDq8ikWAM
  voice_name: Rachel          # just a human-readable label for logs
  model: eleven_v3            # expressive model that PERFORMS inline audio tags
                              # ([sighs], [scoffs], ...) inserted by the
                              # voice_direction pass — sounds like a real person,
                              # not flat TTS. Verified to return word timestamps
                              # so captions stay in sync. If a request errors,
                              # tts.py falls back once to eleven_turbo_v2_5.
  stability: 0.5              # 0-1: lower = more expressive, higher = steadier
  similarity_boost: 0.75      # 0-1: how closely to match the voice
  speed: 1.08                 # narration pace. 0.7-1.2 (1.0 = normal). 1.08-1.12
                              # reads noticeably snappier without sounding rushed.
                              # Captions stay in sync automatically (timings come
                              # back from ElevenLabs at this speed).

# --- VIDEO / CAPTIONS -----------------------------------------------
video:
  width: 1080                 # vertical 9:16 dimensions
  height: 1920
  fps: 30
  # Encoding quality / size. Without a cap, busy stock footage ballooned to
  # ~100MB per clip. CRF is quality (lower = better/bigger; 23-28 typical);
  # max_bitrate caps the peak so files stay small with no visible loss on
  # phone screens.
  crf: 25
  max_bitrate: "3M"
  buf_size: "6M"

captions:
  font: DejaVu Sans          # bundled in video/fonts so captions render on cloud Linux
  font_size: 96
  font_color: white
  outline_color: black
  outline_width: 7            # thick outline so text stays legible on any footage
  shadow: 3                   # drop shadow for depth/pop
  pop: true                   # punch-in scale animation as each caption appears
  position: center            # center | lower-third
  words_per_caption: 3        # how many words to show at once

# --- HOOK LINE (AI-written cold open) --------------------------------
# Before the story, the narrator speaks ONE attention-grabbing line that
# Claude writes to stop the scroll in the first ~2 seconds — a curiosity
# gap or the single weirdest detail, aimed at that subreddit's audience.
# It is spoken AND shown on screen (captions are synced to the narration).
#
# Needs ANTHROPIC_API_KEY in .env (local) or the environment (cloud). If the
# key is missing, the package isn't installed, the call fails, or the model
# decides it can't beat the title, AgentDrop simply opens with the story
# title instead (the old behavior) — nothing breaks.
hook:
  enabled: true
  model: claude-opus-4-8   # smartest model; ~half a cent per video at 3/day

# --- TITLE (YouTube homepage CTR) ------------------------------------
# The raw Reddit title is a flat summary ("Airport no pickup"). Claude
# rewrites it as a SHORT, EXAGGERATED, superlative line ("The Most
# ENTITLED Airport Demand Ever!") — the title is a top CTR/discovery
# lever and shows on the homepage shelf. DISPLAY only: never spoken (the
# narration keeps the real story title for context). One per story,
# cached; multi-part series share the base title + "(Part i/n)". Honors
# the video-settings policy (short, caps + punctuation, NO hashtags).
# Fails safe (no key / error / SKIP -> raw title). Needs ANTHROPIC_API_KEY.
title:
  enabled: true
  model: claude-opus-4-8

# --- OUTRO CALL-TO-ACTION --------------------------------------------
# A fixed closing line the narrator speaks (and that shows on screen,
# since captions are synced to the narration) on the LAST part of each
# story. Goal: turn watchers into commenters/sharers — the engagement
# signal that pushes a video past the algorithm's first test audience.
# Multi-part series get it on the final part only (never repeated).
outro:
  enabled: true
  text: "Would you have done the same? Share your story in the comments."

# --- SCRIPT RETENTION BEATS (AI, minimal & additive) -----------------
# Before narration, Claude makes a LIGHT pass over each part's story body
# and may insert only tiny connective/cliffhanger beats ("but it got
# worse", "here's the part nobody believes") to keep viewers locked in.
# It must NOT change, remove, or invent story facts; any edit that
# shortens the text or grows it past ~25% is discarded and the original
# is used. Fails safe (no key / error / package missing -> original text),
# exactly like the hook. Needs ANTHROPIC_API_KEY. ~half a cent per part.
punch_up:
  enabled: true
  model: claude-opus-4-8

# After punch_up, Claude inserts a FEW ElevenLabs v3 audio tags ([sighs],
# [scoffs], [laughs], [whispers], ...) into each part's body so the v3 voice
# PERFORMS emotion instead of reading flat — our main differentiator from the
# sea of identical reddit-TTS Shorts. It may ONLY add bracketed tags: the words
# are checked to be byte-for-byte identical after tags are stripped, so no story
# text can change. Tags are heard but never shown (tts.py strips [...] from
# captions). Fails safe (no key / error / guard reject -> plain narration),
# exactly like punch_up. Needs ANTHROPIC_API_KEY. ~half a cent per part.
voice_direction:
  enabled: true
  model: claude-opus-4-8

# Auto-shorten: if a story is longer than the part cap allows
# (splitting.words_per_part * splitting.max_parts ≈ 360 words), Claude tightens
# it down to fit — keeping the whole arc and the ending — instead of the story
# being SKIPPED. Paste stories you like even if they're a bit long; this trims
# them. Stories longer than max_source_words are still skipped (too long to
# condense without gutting). Fails safe (no key / error / guard reject -> the
# story is left as-is, and may then be skipped). Needs ANTHROPIC_API_KEY.
condense:
  enabled: true
  model: claude-opus-4-8
  max_source_words: 1200   # screen: allow stories up to this (they'll be
                           # condensed); longer than this is rejected.

# --- REVIEW / APPROVAL ----------------------------------------------
# "manual" = you approve every video before upload (SAFE DEFAULT).
# "auto"   = uploads automatically with no approval. Don't switch to
#            this until you trust the output quality.
approval_mode: auto

# --- SCHEDULING -----------------------------------------------------
# Timezone for the upload_times below. On your Mac this is automatic,
# but in the cloud (Railway runs on UTC) you MUST set this to your zone
# so "09:00" means 9am YOUR time. Examples: America/New_York,
# America/Los_Angeles, Europe/London.
timezone: America/Chicago

# --- UPLOAD SCHEDULE ------------------------------------------------
upload:
  videos_per_day: 3
  # 24-hour clock, your computer's local time. One upload per time.
  upload_times:
    - "09:00"
    - "14:00"
    - "19:00"
  privacy_status: public      # private | unlisted | public
                              # PUBLIC: uploads are visible to everyone.
  category_id: "24"           # 24 = Entertainment (always, per channel policy).
                              # 22 = People & Blogs, 27 = Education.
  made_for_kids: false        # almost always false for these

# --- TIKTOK CROSS-POSTING -------------------------------------------
# Posts the same approved 9:16 videos to TikTok on its OWN schedule
# (independent of the YouTube times above). Needs TIKTOK_CLIENT_KEY /
# TIKTOK_CLIENT_SECRET in the env and a one-time authorization
# (python3 -m upload.tiktok_auth).
tiktok:
  enabled: false             # PAUSED 2026-07-01: inbox mode needs manual tapping
                             # (no automation payoff) + platform unvalidated + YouTube
                             # not yet dialed in. Re-enable when (a) YouTube is steady
                             # and (b) TikTok audit clears so 'direct' auto-publish works.
                             # Was ON 2026-06-30 for @storydropper1.
  mode: inbox                # inbox  = push to TikTok drafts, you tap Post
                             #          (works BEFORE app audit) <-- CURRENT
                             # direct = auto-publish public (needs audit +
                             #          the video.publish scope)
  privacy_level: SELF_ONLY   # used by 'direct' mode once audited:
                             # PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS | SELF_ONLY
  videos_per_day: 3
  post_times:                # 24h clock, same timezone as YouTube
    - "10:00"
    - "15:00"
    - "20:00"

# --- PERFORMANCE-WEIGHTED SELECTION ---------------------------------
# Once enough data exists, bias story picking toward subreddits that
# perform well. The score is age-normalized (views/day since upload) and
# rewards engagement (likes + comments), so fast-climbing recent videos
# beat old ones that merely accumulated views over time.
use_performance_weighting: true
performance:
  boost: 3.0           # max points added to a story's score for a top subreddit
  prior_weight: 1.5    # shrinkage: higher = trust the global average more while
                       # samples are small (stops one viral video dominating)

# --- NOTIFICATIONS (daily Slack digest) -----------------------------
# Once a day, send a Slack message with channel totals + their deltas
# (yesterday / last week / last month), the top videos, and how many
# unused manual stories remain. Needs SLACK_WEBHOOK_URL set in the env.
notifications:
  enabled: true
  channel: slack             # slack (email support can be added later)
  digest_time: "20:00"       # 24h clock, Central (uses the scheduler timezone)
  top_n: 3                   # how many top videos to list
  restock_min_days: 4        # warn when the queue's UPLOAD runway (not story
                             # count) drops to this many days or fewer. Each
                             # story ≈ 3 uploads, so runway = uploads ÷ posts/day.

# --- SPENDING SAFEGUARDS (hard limits the agent will not cross) -----
safeguards:
  # Max videos AgentDrop will PRODUCE per day (each one spends TTS
  # credits). A hard ceiling even if something loops/misfires.
  max_videos_per_day: 3
  # Max TTS characters per calendar month. Set this AT or BELOW your
  # ElevenLabs plan so code stops before the plan does.
  # Rough guide: ~1,300 chars per video.
  #   Starter 30k  -> ~23 videos/mo  (set budget to 28000)
  #   Creator 121k -> ~90 videos/mo  (set budget to 115000)
  # >>> Set to 115000 ONLY after you upgrade to Creator. While still on
  #     Starter, change this to 28000 or you'll hit ElevenLabs errors. <<<
  monthly_tts_char_budget: 115000
