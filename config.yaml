# ===================================================================
# AgentDrop configuration
# Edit this file to control how AgentDrop behaves. No coding needed.
# Lines starting with '#' are comments (ignored by the program).
# Keep the indentation (spaces) exactly as shown — YAML cares about it.
# ===================================================================

# --- CONTENT TYPE ---------------------------------------------------
# What this pipeline produces:
#   story       = Reddit-story narration Shorts
#   ranking     = cinematic "Top 5 ___" space countdowns (the old format)
#   clipranking = silent "Ranking ___ Moments" ranked stock-video clips
#                 (the 2026-09-15 pivot — see the clipranking: block below)
content_type: clipranking

# --- RANKING CHANNEL — RETIRED 2026-09-15 ---------------------------
# The old space format. Kept only so the pivot is reversible; it runs ONLY if
# content_type is set back to `ranking`, and costs nothing while it isn't.
# See sourcing/_retired_space/README.md for why it was retired and how to
# restore it.
ranking:
  dataset_dir: sourcing/_retired_space/ranking_data   # archived "Top 5" JSONs
  # Auto-refill the dataset pool so production never runs dry (on 2026-07-22 the
  # 4pm drop was missed because every list had been consumed). Each production
  # cycle first tops the buffer back up to `target` whenever fewer than
  # `min_buffer` fresh lists remain, generating NEW topics biased toward the
  # groups the channel's own engagement data says perform best.
  autorefill:
    enabled: true
    min_buffer: 4                      # refill when fewer than this remain unposted
    target: 12                         # generate back up to this many fresh lists
  voiceover: intro                     # intro | full | off  (realistic TTS)
  target_seconds: 25                   # max ~25s. Scripts keep their FULL word
                                       # count — a speed-up (capped 2.4x in
                                       # ranking_assemble.py, pitch preserved via
                                       # atempo) compresses them to this. A short
                                       # that visibly goes by fast is the retention
                                       # play, so speeding the voice is wanted.
                                       # Does NOT re-speak faster, does NOT cut
                                       # words. 0 = off.
  # Optional majestic music track (rights-cleared, e.g. YouTube Audio Library);
  # if unset, a synthesized cinematic bed is used. Example: assets/epic.mp3
  music:

# --- RANKED-CLIP CHANNEL (only used when content_type: clipranking) -
# The 2026-09-15 pivot. Same countdown idea as `ranking` above, but each rank
# shows a real VIDEO CLIP instead of a still, and there is NO narration at all.
# Why no voiceover: 8 of the 10 reference channels in this genre have none, and
# the one that does (2.95M subs) gets 5-50K views — the worst per subscriber of
# the set. It also drops the ElevenLabs bill for this format to zero.
clipranking:
  dataset_dir: sourcing/clip_ranking_data   # folder of "Ranking ___" list JSONs
  # Same self-refill safety net as the ranking channel: on 2026-07-22 the 4pm
  # drop was missed because every list had been consumed. Each production cycle
  # tops the buffer back up to `target` when fewer than `min_buffer` remain.
  autorefill:
    enabled: true
    min_buffer: 4
    target: 12
  target_seconds: 20                 # finished length. Unlike `ranking` this is
                                     # hit EXACTLY by choosing segment durations
                                     # up front (no narration to measure), so
                                     # there is no atempo speed-up pass — which
                                     # would also chew up the music bed.
  # MUSIC — required in practice. There is no narration, so without a track the
  # video carries only its clips' own audio and feels thin.
  #
  # Point music_dir at a folder of RIGHTS-CLEARED tracks (YouTube Audio Library
  # and Pixabay Music are both free and allow commercial use). Drop files
  # straight in, or group them in subfolders named after a category — "ocean",
  # "wildlife", "extreme", "satisfying" — and a matching video takes its track
  # from there, so a calm reef and a motocross crash don't get the same energy.
  # The track is chosen deterministically per video, so consecutive uploads
  # don't repeat one but a re-render keeps its music.
  #
  # Why not YouTube's TRENDING sounds, which would fit this genre better: the
  # upload API cannot attach one at all (it's a mobile-app-only action), so it
  # would break the automation entirely — and a Short carrying a licensed track
  # sends about half its revenue to music licensing instead of the Creator Pool.
  # Baked-in royalty-free audio costs neither.
  #
  # Nothing here is ever synthesised. An earlier build generated its own whoosh
  # on each reveal and it sounded like suction, the same way the space channel's
  # synth bed sounded fake. No real audio -> no audio.
  music_dir: assets/music
  music_volume: 0.55                 # 0-1, relative to the clips' own audio
  music:                             # optional single-file fallback

# The agent stays idle until this date, then produces + posts daily. Set so the
# first automated video goes out 2026-07-09 (the manual July-8 post covers the 8th).
start_date: "2026-07-09"

# --- VIDEO / CAPTIONS -----------------------------------------------
video:
  width: 1080                 # vertical 9:16 dimensions
  height: 1920
  fps: 30
  # Encoding quality / size. Without a cap, busy stock footage ballooned to
  # ~100MB per clip. CRF is quality (lower = better/bigger; 23-28 typical);
  # max_bitrate caps the peak so files stay small with no visible loss on
  # phone screens.
  crf: 25
  max_bitrate: "3M"
  buf_size: "6M"

captions:
  font: DejaVu Sans          # bundled in video/fonts so captions render on cloud Linux
  font_size: 96
  font_color: white
  outline_color: black
  outline_width: 7            # thick outline so text stays legible on any footage
  shadow: 3                   # drop shadow for depth/pop
  pop: true                   # punch-in scale animation as each caption appears
  position: center            # center | lower-third
  words_per_caption: 3        # how many words to show at once

# --- REVIEW / APPROVAL ----------------------------------------------
# "manual" = you approve every video before upload (SAFE DEFAULT).
# "auto"   = uploads automatically with no approval. Don't switch to
#            this until you trust the output quality.
approval_mode: auto

# --- SCHEDULING -----------------------------------------------------
# Timezone for the upload_times below. On your Mac this is automatic,
# but in the cloud (Railway runs on UTC) you MUST set this to your zone
# so "09:00" means 9am YOUR time. Examples: America/New_York,
# America/Los_Angeles, Europe/London.
timezone: America/Chicago

# --- UPLOAD SCHEDULE ------------------------------------------------
upload:
  videos_per_day: 1           # start slow (1/day); raise when ready
  # 24-hour clock, your computer's local time. One upload per time.
  upload_times:
    - "16:00"
  privacy_status: public      # private | unlisted | public
                              # PUBLIC: uploads are visible to everyone.
  category_id: "24"           # 24 = Entertainment (always, per channel policy).
                              # 22 = People & Blogs, 27 = Education.
  made_for_kids: false        # almost always false for these

# --- TIKTOK CROSS-POSTING -------------------------------------------
# Posts the same approved 9:16 videos to TikTok on its OWN schedule
# (independent of the YouTube times above). Needs TIKTOK_CLIENT_KEY /
# TIKTOK_CLIENT_SECRET in the env and a one-time authorization
# (python3 -m upload.tiktok_auth).
tiktok:
  enabled: false             # PAUSED 2026-07-01: inbox mode needs manual tapping
                             # (no automation payoff) + platform unvalidated + YouTube
                             # not yet dialed in. Re-enable when (a) YouTube is steady
                             # and (b) TikTok audit clears so 'direct' auto-publish works.
                             # Was ON 2026-06-30 for @storydropper1.
  mode: inbox                # inbox  = push to TikTok drafts, you tap Post
                             #          (works BEFORE app audit) <-- CURRENT
                             # direct = auto-publish public (needs audit +
                             #          the video.publish scope)
  privacy_level: SELF_ONLY   # used by 'direct' mode once audited:
                             # PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS | SELF_ONLY
  videos_per_day: 3
  post_times:                # 24h clock, same timezone as YouTube
    - "10:00"
    - "15:00"
    - "20:00"

# --- PERFORMANCE-WEIGHTED SELECTION ---------------------------------
# Once enough data exists, bias story picking toward subreddits that
# perform well. The score is age-normalized (views/day since upload) and
# rewards engagement (likes + comments), so fast-climbing recent videos
# beat old ones that merely accumulated views over time.
use_performance_weighting: true
performance:
  boost: 3.0           # max points added to a story's score for a top subreddit
  prior_weight: 1.5    # shrinkage: higher = trust the global average more while
                       # samples are small (stops one viral video dominating)

# --- NOTIFICATIONS (daily Slack digest) -----------------------------
# Once a day, send a Slack message with channel totals + their deltas
# (yesterday / last week / last month), the top videos, and how many
# unused manual stories remain. Needs SLACK_WEBHOOK_URL set in the env.
notifications:
  enabled: true
  channel: slack             # slack (email support can be added later)
  digest_time: "20:00"       # 24h clock, Central (uses the scheduler timezone)
  top_n: 3                   # how many top videos to list
  restock_min_days: 4        # warn when the queue's UPLOAD runway (not story
                             # count) drops to this many days or fewer. Each
                             # story ≈ 3 uploads, so runway = uploads ÷ posts/day.

# --- SPENDING SAFEGUARDS (hard limits the agent will not cross) -----
safeguards:
  # Max videos AgentDrop will PRODUCE per day (each one spends TTS
  # credits). A hard ceiling even if something loops/misfires.
  max_videos_per_day: 3
  # Max TTS characters per calendar month. Set this AT or BELOW your
  # ElevenLabs plan so code stops before the plan does.
  # Rough guide: ~1,300 chars per video.
  #   Starter 30k  -> ~23 videos/mo  (set budget to 28000)
  #   Creator 121k -> ~90 videos/mo  (set budget to 115000)
  # >>> Set to 115000 ONLY after you upgrade to Creator. While still on
  #     Starter, change this to 28000 or you'll hit ElevenLabs errors. <<<
  monthly_tts_char_budget: 115000
